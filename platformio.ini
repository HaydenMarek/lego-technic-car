[platformio]
default_envs = uno_bench

[env]
platform = atmelavr@5.3.0
board = uno
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wpedantic

[env:uno_bench]
build_flags =
    ${env.build_flags}
    -DTECHNIC_RC_ENABLE_BTS7960=0
    -DTECHNIC_RC_ENABLE_CURRENT_PROTECTION=0
    -DTECHNIC_RC_ENABLE_DYNAMIC_BRAKING=0
    -DTECHNIC_RC_ENABLE_MONITOR_COMMANDS=1
    -DTECHNIC_RC_THROTTLE_CURVE_EXPONENT=1

; Nano clone bring-up (goal G1). Same flags as uno_bench; only the board
; differs. The owner's clone has the new (Optiboot) bootloader.
[env:nano_bench]
extends = env:uno_bench
board = nanoatmega328new

[env:uno_bts7960]
build_flags =
    ${env.build_flags}
    -DTECHNIC_RC_ENABLE_BTS7960=1
    -DTECHNIC_RC_ENABLE_CURRENT_PROTECTION=1
    -DTECHNIC_RC_ENABLE_DYNAMIC_BRAKING=0
    -DTECHNIC_RC_ENABLE_MONITOR_COMMANDS=0
    -DTECHNIC_RC_THROTTLE_CURVE_EXPONENT=1

; Nano production build (goal G1). Same flags as uno_bts7960; only the board
; differs. Pin roles are identical on the ATmega328P.
[env:nano_bts7960]
extends = env:uno_bts7960
board = nanoatmega328new

; Bench diagnostic only: nano_bts7960 with current protection disabled, for
; isolating L_IS/R_IS wiring faults. Never drive the car on this profile.
[env:nano_bts7960_noprot]
extends = env:nano_bts7960
build_flags =
    ${env.build_flags}
    -DTECHNIC_RC_ENABLE_BTS7960=1
    -DTECHNIC_RC_ENABLE_CURRENT_PROTECTION=0
    -DTECHNIC_RC_ENABLE_DYNAMIC_BRAKING=0
    -DTECHNIC_RC_ENABLE_MONITOR_COMMANDS=0
    -DTECHNIC_RC_THROTTLE_CURVE_EXPONENT=1
