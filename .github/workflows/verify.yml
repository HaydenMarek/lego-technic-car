name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PlatformIO Core
        run: python -m pip install --disable-pip-version-check platformio==6.1.19
      - name: Run non-hardware verification
        run: ./test/verify.sh --remote-links
